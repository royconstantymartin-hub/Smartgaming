<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fintech Tycoon — Zero to King</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  :root{
    --ink:#20203a; --paper:#f8f8f0; --cream:#f0e8d0; --screen:#e8f0d8;
    --red:#d04848; --blue:#4878d0; --green:#50a850; --gold:#c89010; --violet:#8858c8;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#181828}
  body{
    font-family:'Press Start 2P','Courier New',monospace;
    color:var(--ink); background:#181828; min-height:100vh;
    image-rendering:pixelated; -webkit-font-smoothing:none;
  }
  #shell{max-width:760px;margin:0 auto;min-height:100vh;background:var(--screen);
    box-shadow:0 0 0 6px #383850,0 0 0 12px #101018; position:relative; overflow-x:hidden}
  #shell::after{ /* CRT scanlines */
    content:""; position:fixed; inset:0; pointer-events:none; z-index:200;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 3px);
  }
  #app{padding:14px 12px 110px}
  h1{font-size:14px;line-height:1.6} h2{font-size:12px;line-height:1.6} h3{font-size:10px;line-height:1.7}
  p,li,button,span,div{font-size:10px;line-height:1.8}
  .tiny{font-size:8px;line-height:1.8}
  /* pixel box: double border GB dialog style */
  .pb{background:var(--paper); border:3px solid var(--ink); box-shadow:inset 0 0 0 2px var(--paper), inset 0 0 0 4px var(--ink);
    padding:14px; margin:10px 0; border-radius:2px}
  .pb.dark{background:var(--ink); color:var(--paper); box-shadow:inset 0 0 0 2px var(--ink), inset 0 0 0 4px var(--paper)}
  .pb.cream{background:var(--cream); box-shadow:inset 0 0 0 2px var(--cream), inset 0 0 0 4px var(--ink)}
  button{font-family:inherit; cursor:pointer; color:var(--ink);
    background:var(--paper); border:3px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink); padding:10px 12px; text-transform:uppercase}
  button:active{transform:translate(2px,2px); box-shadow:none}
  button.primary{background:var(--gold); color:#fff; text-shadow:1px 1px 0 var(--ink)}
  button.danger{background:var(--red); color:#fff; text-shadow:1px 1px 0 var(--ink)}
  button.big{width:100%; padding:14px; font-size:11px}
  button:disabled{opacity:.45; cursor:not-allowed}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .sb{justify-content:space-between}
  .grid2{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .grid3{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .bar{height:10px; background:#c8c8b0; border:2px solid var(--ink); position:relative}
  .bar>i{display:block; height:100%; transition:width .5s steps(8)}
  .center{text-align:center}
  .caps{text-transform:uppercase}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .sprite{font-size:52px; line-height:1; filter:drop-shadow(3px 3px 0 rgba(32,32,58,.35))}
  .sprite.big{font-size:72px}
  .sprite.mini{font-size:26px}
  .sprite.shadow{filter:brightness(0) opacity(.55)}
  .hit{animation:hit .45s steps(3)}
  @keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-10px);filter:brightness(3)}50%{transform:translateX(8px)}75%{transform:translateX(-6px);filter:brightness(3)}100%{transform:translateX(0)}}
  .appear{animation:appear .5s steps(5)}
  @keyframes appear{from{transform:translateY(-18px) scale(.3);opacity:0}to{transform:none;opacity:1}}
  .faint{animation:faint .7s steps(6) forwards}
  @keyframes faint{to{transform:translateY(34px);opacity:0}}
  /* battle layout */
  .bfield{background:linear-gradient(180deg,#a8d8a0 0 62%, #88b878 62% 100%);
    border:3px solid var(--ink); padding:10px; position:relative; min-height:215px; margin:10px 0}
  .erow{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
  .prow{display:flex; justify-content:space-between; align-items:flex-end; gap:8px; margin-top:14px}
  .infobox{background:var(--paper); border:3px solid var(--ink); box-shadow:3px 3px 0 rgba(32,32,58,.4); padding:8px 10px; min-width:175px}
  .hearts{font-size:14px; letter-spacing:2px}
  .moves{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  @media(max-width:560px){ .moves{grid-template-columns:1fr} .infobox{min-width:130px} .sprite{font-size:42px}.sprite.big{font-size:58px} }
  .move{text-align:left; text-transform:none; font-size:9px; line-height:1.7; padding:9px}
  .move.good{background:var(--green); color:#fff}
  .move.bad{background:var(--red); color:#fff}
  .move.fade{opacity:.45}
  .arrow{position:absolute; right:12px; bottom:6px; animation:blink 1s steps(2) infinite}
  .dlg{position:relative; min-height:64px}
  nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:760px;
    background:var(--paper); border-top:4px solid var(--ink); display:flex; z-index:100}
  nav button{flex:1; border:none; box-shadow:none; border-right:3px solid var(--ink); padding:9px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px; background:var(--paper); font-size:8px}
  nav button:last-child{border-right:none}
  nav button .nico{font-size:18px}
  nav button.on{background:var(--ink); color:var(--paper)}
  nav button:active{transform:none}
  .badge{display:inline-block; width:34px; height:34px; line-height:30px; text-align:center;
    border:3px solid var(--ink); background:var(--paper); font-size:16px; margin-right:6px}
  .badge.empty{opacity:.3}
  .tag{display:inline-block; border:2px solid var(--ink); padding:2px 6px; font-size:8px; background:var(--paper); text-transform:uppercase}
  .tag.gold{background:var(--gold); color:#fff} .tag.red{background:var(--red); color:#fff}
  .tag.green{background:var(--green); color:#fff} .tag.blue{background:var(--blue); color:#fff}
  .mcard{cursor:pointer} .mcard:active{transform:translate(2px,2px)}
  input[type=text]{font-family:inherit; font-size:11px; width:100%; padding:12px;
    border:3px solid var(--ink); background:#fff; color:var(--ink); text-transform:uppercase}
  .toast{position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:300;
    background:var(--ink); color:var(--paper); border:3px solid var(--paper); box-shadow:0 0 0 3px var(--ink);
    padding:10px 16px; font-size:10px; animation:tpop 2s steps(8) forwards}
  @keyframes tpop{0%{opacity:0;transform:translateX(-50%) translateY(-14px)}10%{opacity:1;transform:translateX(-50%)}85%{opacity:1}100%{opacity:0}}
  .lessonli{margin:0 0 12px 0; padding-left:16px; position:relative}
  .lessonli::before{content:"▶"; position:absolute; left:0; font-size:8px; top:4px}
  .crown{font-size:60px; animation:floaty 2s steps(4) infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .timerbox{font-size:14px; color:#fff; background:var(--red); border:3px solid var(--ink); padding:5px 9px}
  .rankrow{display:flex; gap:8px; align-items:center; padding:6px 8px; border-bottom:2px dashed #b0b098}
  .rankrow.now{background:var(--gold); color:#fff}
  .rankrow.done{opacity:.5}
</style>
</head>

<script>

const MODULES = [
{id:"fin1", track:"fin", tier:1, ico:"🏦", mon:"COINLET", mico:"🐣", name:"Money & Banking Basics",
 lesson:[
  "Money does three jobs: a medium of exchange (you pay with it), a unit of account (you price things in it), and a store of value (you save it).",
  "Commercial banks take deposits from savers and lend that money to borrowers. The gap between the interest they pay and the interest they charge is their core profit.",
  "Interest is simply the price of borrowing money. Compound interest means you earn interest on past interest — money snowballs over time.",
  "Inflation is a general rise in prices: each unit of money buys less. Moderate inflation is normal; high inflation destroys savings.",

 ]},
{id:"tech1", track:"tech", tier:1, ico:"⚙️", mon:"BITPUP", mico:"🐶", name:"How Software Works",
 lesson:[
  "Hardware is the physical machine; software is the set of instructions (code) that tells it what to do.",
  "Apps usually split into a frontend (what the user sees and touches) and a backend (servers and logic running elsewhere).",
  "A database is organized storage for data that apps can read and write reliably — your bank balance lives in one.",
  "The internet is a network of networks: machines exchanging data via shared protocols. HTTP is the protocol browsers use to talk to servers.",

 ]},

{id:"fin2", track:"fin", tier:2, ico:"📈", mon:"BULLISH", mico:"🐂", name:"Markets & Investing",

 ]},
{id:"tech2", track:"tech", tier:2, ico:"🔌", mon:"CLOUDRA", mico:"🐲", name:"APIs, Cloud & Data",
 lesson:[
  "An API (Application Programming Interface) is a contract that lets one program use another program's features or data.",
  "Open banking forces banks to expose APIs, letting fintechs build on top of bank accounts — this unlocked an entire industry.",
  "Cloud computing means renting computing power and storage on demand instead of buying servers. Pay for what you use, scale instantly.",
  "SaaS = software delivered via the browser on subscription (e.g. Stripe dashboard); IaaS rents raw machines; PaaS rents a managed platform.",
  "Microservices split a system into small independent services; a monolith is one big codebase. Microservices scale teams, monoliths are simpler.",
  "Big data is described by the 3 Vs: Volume (a lot), Velocity (fast), Variety (many formats).",

 ]},
{id:"ai2", track:"ai", tier:2, ico:"📐", mon:"DATAMITE", mico:"🐜", name:"Machine Learning Fundamentals",
 lesson:[
  "Machine learning finds patterns in historical data to make predictions about new data.",

{id:"tech3", track:"tech", tier:3, ico:"🔐", mon:"CRYPTYX", mico:"🦂", name:"Security, Blockchain & Crypto",

{id:"ai3", track:"ai", tier:3, ico:"✨", mon:"PROMPTGEIST", mico:"👻", name:"Deep Learning, LLMs & GenAI",

  "A large language model (LLM) is trained on massive text to do one core thing: predict the next token. Everything else emerges from that.",

 ]},
{id:"fin4", track:"fin", tier:4, ico:"⚖️", mon:"REGULOX", mico:"🦉", name:"Risk, Regulation & RegTech",

  "KYC (Know Your Customer): verifying who your customers really are before serving them. Step one of any fintech.",

const QUESTIONS = [

{id:"tech1_8",m:"tech1",d:3,c:"software",q:"Why do most fintech startups build on existing APIs (payments, KYC) instead of building everything themselves?",o:["Regulators forbid building in-house","Speed and focus: buying commodity pieces lets them spend effort on what differentiates them","APIs are always free","Investors require it"],a:1,x:"Build vs buy: rebuilding solved problems burns time and money. Winners assemble proven blocks and innovate on top."},
// ai1
{id:"ai1_1",m:"ai1",d:1,c:"ai-definition",q:"Artificial Intelligence is software that...",o:["Is always smarter than humans","Performs tasks that typically require human intelligence","Only plays chess","Has feelings"],a:1,x:"Recognizing images, understanding language, predicting outcomes — tasks once exclusive to human minds."},
{id:"ai1_2",m:"ai1",d:2,c:"ml-vs-rules",q:"The key difference between machine learning and traditional rules-based software:",o:["ML is always faster","ML learns patterns from data instead of following hand-written rules","Rules-based software cannot do math","ML does not need computers"],a:1,x:"Instead of a human writing IF/THEN rules, ML infers the rules from examples."},
{id:"ai1_3",m:"ai1",d:1,c:"data",q:"What is the 'fuel' of machine learning?",o:["Electricity","Data","Programmers","Luck"],a:1,x:"Models learn from examples. More good data usually means better predictions; bad data means bad predictions."},
{id:"ai1_4",m:"ai1",d:2,c:"narrow-ai",q:"Today's AI systems are called 'narrow' because they...",o:["Run on small computers","Excel at specific tasks but cannot generalize across all human tasks","Only work at night","Are owned by few companies"],a:1,x:"A fraud-detection model cannot drive a car. Artificial GENERAL intelligence remains a research goal, not a reality."},
{id:"ai1_5",m:"ai1",d:2,c:"ai-history",q:"The Turing test asks whether a machine can...",o:["Beat a human at chess","Hold a conversation indistinguishable from a human's","Compute faster than a calculator","Pass a math exam"],a:1,x:"Alan Turing proposed it in 1950: if you cannot tell the machine from the human in conversation, call it intelligent."},
{id:"ai1_6",m:"ai1",d:1,c:"ai-definition",q:"Which is an everyday example of AI?",o:["A pocket calculator","Your bank flagging a suspicious card payment automatically","A light switch","A paper map"],a:1,x:"Fraud alerts, face unlock, music recommendations, spam filters — AI already runs your daily life quietly."},
{id:"ai1_7",m:"ai1",d:2,c:"ai-history",q:"The recent AI boom is mainly driven by...",o:["A single genius inventor","Big data + cheap massive compute (GPUs) + better algorithms","Government mandates","Faster internet cables alone"],a:1,x:"All three converged in the 2010s-2020s. Remove any one and the boom stalls."},
{id:"ai1_8",m:"ai1",d:3,c:"data",q:"An AI system trained mostly on data from one country is used worldwide. The biggest risk is...",o:["It runs slower abroad","Its learned patterns may not fit other populations, causing biased or wrong outputs","It uses more electricity","It violates patents"],a:1,x:"Models inherit the blind spots of their training data. Distribution shift and bias are the top causes of real-world AI failure."},
// fin2
{id:"fin2_1",m:"fin2",d:1,c:"stocks",q:"Owning a share of stock means you...",o:["Lent money to the company","Own a fraction of the company","Work for the company","Insure the company"],a:1,x:"Equity = ownership. You benefit from rising value and dividends, and you bear losses if it sinks."},
{id:"fin2_2",m:"fin2",d:1,c:"bonds",q:"A bond is essentially...",o:["A share of ownership","A loan you make to a company or government","A type of bank account","A lottery ticket"],a:1,x:"The issuer pays you interest (the coupon) and repays the principal at maturity."},
{id:"fin2_3",m:"fin2",d:2,c:"risk-return",q:"The risk-return tradeoff says...",o:["Safe investments earn the most","Higher potential returns come with higher potential losses","Risk can be eliminated entirely","Returns are random and unrelated to risk"],a:1,x:"Anyone promising high returns with no risk is selling either a misunderstanding or a fraud."},
{id:"fin2_4",m:"fin2",d:1,c:"diversification",q:"Diversification means...",o:["Buying only the best stock","Spreading investments across many assets to reduce risk","Investing only in your own country","Changing banks often"],a:1,x:"When one asset crashes, others may hold. It is the only 'free lunch' in investing."},
{id:"fin2_5",m:"fin2",d:2,c:"etf",q:"An ETF is...",o:["A single company's stock","A basket of assets traded as one share","A type of cryptocurrency","A savings account"],a:1,x:"One purchase, instant diversification, low fees — the workhorse of modern investing."},
{id:"fin2_6",m:"fin2",d:2,c:"valuation",q:"A company has 1M shares trading at $50 each. Its market cap is...",o:["$50 million","$1 million","$50 thousand","$500 million"],a:0,x:"Market cap = price × shares = 50 × 1,000,000 = $50M. It is the market's price tag on the whole company."},
{id:"fin2_7",m:"fin2",d:1,c:"risk-return",q:"A 'bull market' is when prices are...",o:["Falling","Rising","Frozen","Only moving sideways"],a:1,x:"Bulls strike upward, bears swipe downward — rising vs falling markets."},
{id:"fin2_8",m:"fin2",d:3,c:"bonds",q:"Interest rates rise sharply. What happens to EXISTING bond prices?",o:["They rise","They fall","Nothing","They become stocks"],a:1,x:"New bonds now pay more, so old low-coupon bonds must sell at a discount to compete. Rates up, bond prices down."},
// tech2
{id:"tech2_1",m:"tech2",d:1,c:"api",q:"An API is...",o:["A type of computer chip","A contract that lets one program use another program's features or data","An internet provider","A security camera"],a:1,x:"APIs are how software talks to software. Stripe's API lets your app charge cards without you touching the card networks."},
{id:"tech2_2",m:"tech2",d:2,c:"api",q:"Why did open banking APIs transform fintech?",o:["They made banks free","They let licensed third parties access bank data and payments, enabling apps built on top of any bank","They removed all regulation","They replaced the internet"],a:1,x:"Account aggregators, budgeting apps, instant credit scoring — all exist because banks were forced to open APIs."},
{id:"tech2_3",m:"tech2",d:1,c:"cloud",q:"Cloud computing means...",o:["Storing data in the atmosphere","Renting computing power and storage on demand instead of owning servers","Using only wireless internet","Free computers for startups"],a:1,x:"AWS, Google Cloud, Azure: pay-as-you-go datacenters. Startups scale from zero to millions of users without buying a single machine."},
{id:"tech2_4",m:"tech2",d:2,c:"saas",q:"Which is a SaaS product?",o:["A rented bare-metal server","An online accounting app you use in the browser on subscription","A USB stick","A laptop"],a:1,x:"Software-as-a-Service: the vendor runs everything; you log in and pay monthly."},
{id:"tech2_5",m:"tech2",d:2,c:"cloud",q:"The biggest advantage of cloud for a fintech startup is...",o:["It is always cheaper at huge scale","No upfront hardware cost and instant scaling as users grow","It removes the need for engineers","It guarantees zero downtime"],a:1,x:"Zero capex and elasticity. (At massive scale some companies actually leave the cloud to cut costs.)"},
{id:"tech2_6",m:"tech2",d:3,c:"microservices",q:"Microservices vs monolith — the real tradeoff is...",o:["Microservices are always better","Independent scaling and team autonomy vs added complexity in communication and operations","Monoliths cannot use databases","Microservices need no testing"],a:1,x:"Many small services = flexibility but distributed-systems pain. One codebase = simplicity but coupling. Stage-dependent choice."},
{id:"tech2_7",m:"tech2",d:2,c:"big-data",q:"The '3 Vs' of big data are...",o:["Value, Vision, Victory","Volume, Velocity, Variety","Virtual, Visible, Verified","Vectors, Versions, Volumes"],a:1,x:"A lot of data, arriving fast, in many formats — that is when ordinary tools break and 'big data' tech begins."},
{id:"tech2_8",m:"tech2",d:3,c:"api",q:"A webhook differs from a normal API call because...",o:["It is encrypted","The server pushes a notification to YOU when an event happens, instead of you polling","It only works at night","It cannot carry data"],a:1,x:"Polling asks 'anything new?' every second. A webhook means the payment processor calls your URL the instant money lands."},
// ai2
{id:"ai2_1",m:"ai2",d:1,c:"ml-definition",q:"Machine learning is the practice of...",o:["Writing rules by hand for every case","Learning patterns from historical data to predict new cases","Building robots","Storing data in the cloud"],a:1,x:"Show the model thousands of past examples; it infers the pattern; it predicts on the next one."},
{id:"ai2_2",m:"ai2",d:2,c:"supervised",q:"Supervised learning requires...",o:["A human watching the computer","Labeled examples (input + known correct answer)","No data at all","A robot supervisor"],a:1,x:"To learn 'fraud vs legit', the model needs past transactions already labeled fraud or legit."},
{id:"ai2_3",m:"ai2",d:2,c:"unsupervised",q:"Grouping customers into segments WITHOUT predefined labels is...",o:["Supervised learning","Unsupervised learning (clustering)","Reinforcement learning","Manual sorting"],a:1,x:"Clustering finds natural structure in data — 'these users behave alike' — without being told the categories."},
{id:"ai2_4",m:"ai2",d:2,c:"evaluation",q:"Why split data into training and test sets?",o:["To save storage","To evaluate the model on data it has never seen, proving it generalizes","Because GPUs require it","To train twice as fast"],a:1,x:"Grading a model on its own training data is like grading students on questions they memorized with answers."},
{id:"ai2_5",m:"ai2",d:3,c:"overfitting",q:"Overfitting means the model...",o:["Is too small for the data","Memorized noise in training data and performs poorly on new data","Trains too slowly","Uses too little memory"],a:1,x:"Perfect on the past, useless on the future. The classic ML failure — and the classic trading-strategy failure too."},
{id:"ai2_6",m:"ai2",d:2,c:"features",q:"In ML, 'features' are...",o:["The model's settings menu","The input variables the model uses to predict (amount, time, location...)","Bugs in the code","Marketing highlights"],a:1,x:"Feature engineering — choosing and shaping good inputs — often matters more than the algorithm itself."},
{id:"ai2_7",m:"ai2",d:2,c:"supervised",q:"Predicting whether a transaction is fraud (yes/no) vs predicting a customer's lifetime value ($) — these are...",o:["Both classification","Classification vs regression","Both regression","Clustering vs ranking"],a:1,x:"Category output = classification. Numeric output = regression."},
{id:"ai2_8",m:"ai2",d:3,c:"evaluation",q:"A fraud model is 99.9% accurate on data where 99.9% of transactions are legit. What is wrong?",o:["Nothing, ship it","It may catch ZERO fraud — predicting 'always legit' achieves the same accuracy","Accuracy cannot exceed 99%","The data is too small"],a:1,x:"On imbalanced data, accuracy lies. Use precision and recall: of flagged transactions how many are fraud, and of all fraud how much is caught."},
// fin3
{id:"fin3_1",m:"fin3",d:2,c:"payments",q:"In a card payment, the ISSUER is...",o:["The merchant's bank","The customer's bank that issued the card","The card network","The cash register company"],a:1,x:"Issuer = customer's bank. Acquirer = merchant's bank. The network (Visa/Mastercard) connects them."},
{id:"fin3_2",m:"fin3",d:2,c:"interchange",q:"The interchange fee is...",o:["A currency exchange rate","A per-transaction fee paid to the card issuer, funding card businesses","A tax on imports","A subway ticket"],a:1,x:"A slice of every card payment flows to the issuer — it funds rewards programs and is core revenue for card fintechs."},
{id:"fin3_3",m:"fin3",d:1,c:"neobanks",q:"A neobank is...",o:["A bank for new customers only","A digital-only bank without physical branches","A central bank","A crypto exchange"],a:1,x:"App-first, low fees, slick UX — often running on a partner bank's license underneath."},
{id:"fin3_4",m:"fin3",d:2,c:"bnpl",q:"In the BNPL model, who primarily pays the BNPL provider?",o:["The shopper, via huge mandatory interest","The merchant, paying a fee for increased conversion and basket size","The government","Nobody, it is charity"],a:1,x:"Merchants pay because installment options make people buy more. Late fees from shoppers add a second stream."},
{id:"fin3_5",m:"fin3",d:3,c:"revenue-models",q:"How do zero-commission trading apps make money?",o:["They do not — they are nonprofits","Payment for order flow, interest on idle cash, premium subscriptions","Selling users' passwords","Government grants"],a:1,x:"'Free' has a business model behind it. Routing orders to market makers and earning interest on your cash are the engines."},
{id:"fin3_6",m:"fin3",d:2,c:"lending",q:"P2P lending platforms...",o:["Let banks lend to other banks","Match individual lenders with borrowers directly, taking a platform fee","Print their own currency","Only lend to governments"],a:1,x:"The platform handles scoring and servicing; investors take the credit risk in exchange for the interest."},
{id:"fin3_7",m:"fin3",d:3,c:"unit-economics",q:"A fintech spends $200 to acquire each customer (CAC) who generates $120 lifetime value (LTV). Scaling up will...",o:["Fix the problem automatically","Burn cash faster — every new customer destroys $80 of value","Double the LTV","Please investors"],a:1,x:"LTV must exceed CAC. Growth with broken unit economics is just accelerated bankruptcy."},
{id:"fin3_8",m:"fin3",d:3,c:"payments",q:"Why are payments described as a 'rails' business?",o:["They were invented by railway companies","Revenue = enormous volume × tiny take rate flowing over fixed infrastructure","They only work on straight lines","Because of blockchain"],a:1,x:"Like railways: build the track once, earn a tiny toll on everything that moves across it. Volume is everything."},
// tech3
{id:"tech3_1",m:"tech3",d:1,c:"encryption",q:"Encryption protects data by...",o:["Deleting it after reading","Scrambling it so only key-holders can read it","Hiding it in images","Making backups"],a:1,x:"In transit (HTTPS) and at rest (encrypted disks) — unreadable without the key."},
{id:"tech3_2",m:"tech3",d:1,c:"authentication",q:"Two-factor authentication (2FA) combines...",o:["Two passwords","Something you know (password) + something you have (phone/key)","Two usernames","Fingerprint and face only"],a:1,x:"Stealing a password is easy; stealing the password AND your phone is much harder."},
{id:"tech3_3",m:"tech3",d:1,c:"security-human",q:"Phishing is...",o:["A network speed test","Tricking people into revealing credentials via fake messages or sites","A type of firewall","Catching computer viruses"],a:1,x:"Most breaches start with a human clicking the wrong link, not with broken cryptography."},
{id:"tech3_4",m:"tech3",d:2,c:"blockchain",q:"A blockchain is fundamentally...",o:["A faster database for banks","A distributed append-only ledger replicated across many computers","A cryptocurrency","A programming language"],a:1,x:"No single party controls the record; consensus among many machines does."},
{id:"tech3_5",m:"tech3",d:3,c:"blockchain",q:"What makes tampering with old blockchain records evident?",o:["Police monitoring","Each block contains the hash of the previous one — changing history breaks every later block","A daily manual audit","Blocks are printed on paper"],a:1,x:"Hash-chaining: modify one byte of an old block and every subsequent hash stops matching. The network rejects the fork."},
{id:"tech3_6",m:"tech3",d:2,c:"bitcoin",q:"The relationship between Bitcoin and blockchain:",o:["They are the same thing","Bitcoin is one application built ON a blockchain; blockchain is the underlying technology","Blockchain is a type of Bitcoin","Bitcoin invented the internet"],a:1,x:"Blockchain also powers other chains, tokenized assets, and settlement experiments far beyond Bitcoin."},
{id:"tech3_7",m:"tech3",d:2,c:"smart-contracts",q:"A smart contract is...",o:["A PDF signed electronically","A program on a blockchain that executes automatically when conditions are met","A lawyer chatbot","A phone subscription"],a:1,x:"Code as enforcement: 'when payment arrives, release the asset' — executed by the network, no intermediary."},
{id:"tech3_8",m:"tech3",d:2,c:"wallets",q:"If you lose the private key to your crypto wallet...",o:["Support resets it in 24h","The funds are permanently inaccessible — no reset exists","The bank refunds you","You can guess it eventually"],a:1,x:"Self-custody means total responsibility. An estimated 20% of all Bitcoin is lost forever this way."},
// ai3
{id:"ai3_1",m:"ai3",d:1,c:"neural-networks",q:"Neural networks are loosely inspired by...",o:["Telephone switchboards","The human brain's interconnected neurons","Spider webs","Road networks"],a:1,x:"Layers of simple units, each transforming the data slightly — stacked, they learn astonishing patterns."},
{id:"ai3_2",m:"ai3",d:2,c:"deep-learning",q:"The 'deep' in deep learning refers to...",o:["Deep philosophical questions","Many layers in the neural network","Underwater datacenters","Deep storage of data"],a:1,x:"Depth = many stacked layers, letting the network build complex concepts from simple ones."},
{id:"ai3_3",m:"ai3",d:2,c:"llm",q:"At its core, a large language model is trained to...",o:["Search the internet","Predict the next token (word piece) given the previous ones","Translate only","Store conversations"],a:1,x:"Everything an LLM does — answering, coding, reasoning — emerges from next-token prediction at colossal scale."},
{id:"ai3_4",m:"ai3",d:2,c:"llm",q:"Why do most companies use frontier LLMs via API instead of training their own?",o:["Training is illegal","Training frontier models costs enormous data, GPUs, and expertise that few possess","APIs are always free","Their own models would be too accurate"],a:1,x:"Frontier training runs cost hundreds of millions. Building ON TOP of models via API is where most value is created."},
{id:"ai3_5",m:"ai3",d:1,c:"prompting",q:"A 'prompt' is...",o:["The model's source code","The input/instructions you give a model","An error message","A type of GPU"],a:1,x:"Clear context, constraints, and examples in the prompt dramatically change output quality."},
{id:"ai3_6",m:"ai3",d:2,c:"hallucination",q:"LLM 'hallucination' means the model...",o:["Crashes","Produces fluent, confident, but false statements","Refuses to answer","Sees images in text"],a:1,x:"In finance this is dangerous: always verify model output against a source of truth before money moves."},
{id:"ai3_7",m:"ai3",d:3,c:"rag",q:"You want an LLM to answer using YOUR company's documents, updated daily. Best approach:",o:["Retrain the model from scratch daily","RAG: retrieve relevant documents at question time and include them in the prompt","Email the documents to the AI company","Fine-tune once and never update"],a:1,x:"Retrieval-augmented generation keeps knowledge fresh without retraining — the standard pattern for enterprise AI."},
{id:"ai3_8",m:"ai3",d:3,c:"deep-learning",q:"Why are GPUs (not CPUs) the workhorse of deep learning?",o:["They are cheaper","Deep learning is mostly giant matrix multiplications, which GPUs execute massively in parallel","They use less power","CPUs cannot do math"],a:1,x:"A GPU runs thousands of simple operations simultaneously — exactly the shape of neural network math."},
// fin4
{id:"fin4_1",m:"fin4",d:1,c:"kyc",q:"KYC stands for...",o:["Keep Your Cash","Know Your Customer — verifying who your customers really are","Key Yield Curve","Know Your Code"],a:1,x:"Identity verification is the legal gateway to offering any financial service."},
{id:"fin4_2",m:"fin4",d:2,c:"aml",q:"AML rules exist to...",o:["Limit ATM withdrawals","Prevent criminals from disguising illegal money as legitimate through the financial system","Set minimum interest rates","Protect bank buildings"],a:1,x:"Fintechs must monitor flows, flag suspicious patterns, and report them — or face crushing fines."},
{id:"fin4_3",m:"fin4",d:3,c:"capital",q:"Why must banks hold capital buffers?",o:["To pay staff bonuses","So loan losses hit shareholders' capital before threatening depositors' money","To buy government bonds","To fund marketing"],a:1,x:"Capital absorbs losses. The 2008 crisis showed what happens when buffers are too thin for the risks taken."},
{id:"fin4_4",m:"fin4",d:3,c:"risk-types",q:"A trader's systems crash during a market spike, causing losses. This is...",o:["Credit risk","Market risk","Operational risk","Inflation risk"],a:2,x:"Operational risk = failures of systems, processes, or people. Credit = defaults; market = price moves."},
{id:"fin4_5",m:"fin4",d:2,c:"regtech",q:"RegTech refers to...",o:["Regulating technology companies","Technology that automates compliance: screening, monitoring, reporting","A government tech department","Regular technology updates"],a:1,x:"AI-driven transaction monitoring and automated KYC turn compliance from an army of clerks into software."},
{id:"fin4_6",m:"fin4",d:3,c:"open-banking-reg",q:"PSD2-style open banking regulation matters because it...",o:["Closed all bank branches","Forced banks to share data/payments access with licensed third parties, creating the fintech app ecosystem","Banned credit cards","Merged all banks"],a:1,x:"Regulation, not just technology, opened the door: your budgeting app legally plugs into your bank because of it."},
{id:"fin4_7",m:"fin4",d:2,c:"sandbox",q:"A regulatory sandbox lets startups...",o:["Avoid all regulation forever","Test innovative products with real users under regulator supervision before full licensing","Play games at work","Hide from auditors"],a:1,x:"A controlled space to prove a model works before paying the full cost of licensing."},
{id:"fin4_8",m:"fin4",d:2,c:"data-protection",q:"Why is GDPR existential for fintechs?",o:["It only affects social networks","Fines reach 4% of global revenue, and losing customer trust over data is often fatal","It bans databases","It applies only to banks"],a:1,x:"Fintechs hold the most sensitive data there is: money + identity. Mishandling it ends companies."},
// tech4
{id:"tech4_1",m:"tech4",d:2,c:"scalability",q:"Horizontal scaling means...",o:["Buying one bigger server","Adding more machines that share the load","Making the code shorter","Moving servers sideways"],a:1,x:"The web scales out, not up: ten modest machines beat one giant, and you can keep adding."},
{id:"tech4_2",m:"tech4",d:2,c:"latency",q:"Why does latency matter intensely in trading systems?",o:["It does not","Milliseconds determine who gets the price first — slow systems systematically lose","Only the UI cares about speed","Regulators measure it"],a:1,x:"High-frequency firms pay fortunes to shave microseconds. In payments, latency kills checkout conversion instead."},
{id:"tech4_3",m:"tech4",d:2,c:"redundancy",q:"Redundancy in fintech infrastructure means...",o:["Writing the same code twice","Running duplicate systems so a single failure never causes downtime","Hiring backup employees","Deleting unused files"],a:1,x:"Failover: when one instance dies, its twin takes over instantly. Money systems cannot go dark."},
{id:"tech4_4",m:"tech4",d:3,c:"ledgers",q:"Fintech ledgers use double-entry accounting because...",o:["It is twice as fast","Every movement is a debit and a credit, so books always balance and errors surface immediately","Regulators like tradition","It uses less storage"],a:1,x:"If debits and credits stop matching, you KNOW something broke. Single-entry systems silently lose money."},
{id:"tech4_5",m:"tech4",d:3,c:"idempotency",q:"A payment API client times out and retries the same request. Idempotency keys ensure...",o:["The customer is charged twice for safety","The retry is recognized as a duplicate and the charge happens exactly once","The request is always rejected","The server restarts"],a:1,x:"Same key = same operation, executed once. Without this, flaky networks would double-charge customers daily."},
{id:"tech4_6",m:"tech4",d:2,c:"devops",q:"CI/CD pipelines...",o:["Replace all developers","Automatically test and deploy every code change — speed with a safety net","Are only for big banks","Slow down releases on purpose"],a:1,x:"Continuous integration/deployment: each change runs the full test suite before shipping. Fast AND safe."},
{id:"tech4_7",m:"tech4",d:2,c:"caching",q:"Caching improves performance by...",o:["Compressing the database","Keeping frequently-read data in fast memory to cut load and latency","Deleting old data","Buying faster internet"],a:1,x:"But beware: a stale cache showing yesterday's balance is a fintech incident, not an optimization."},
{id:"tech4_8",m:"tech4",d:3,c:"consistency",q:"'Eventual consistency' is acceptable for...",o:["Account balances during a withdrawal","A social feed or analytics dashboard — but NOT for the money ledger itself","Everything in a bank","Nothing, ever"],a:1,x:"Replicas agreeing 'eventually' is fine for likes; for money you need strong consistency or provable reconciliation."},
// ai4
{id:"ai4_1",m:"ai4",d:1,c:"algo-trading",q:"Algorithmic trading is...",o:["Trading only algorithm company stocks","Executing orders automatically by programmed rules at machine speed","Illegal in most countries","Trading without computers"],a:1,x:"The majority of market volume today is machines trading with machines."},
{id:"ai4_2",m:"ai4",d:2,c:"credit-scoring",q:"AI credit scoring improves on classic bureaus mainly by...",o:["Always approving more loans","Using alternative data (cash-flow, behavior) to score people invisible to traditional credit files","Removing the need for repayment","Being unregulated"],a:1,x:"Billions of people lack credit history but generate data. Scoring them expands access — if done responsibly."},
{id:"ai4_3",m:"ai4",d:2,c:"fraud-detection",q:"Real-time AI fraud detection works by...",o:["Blocking all foreign transactions","Scoring every transaction in milliseconds and flagging anomalies versus learned normal behavior","Calling the customer each time","Checking a list of banned names only"],a:1,x:"Anomaly detection at transaction speed: your card works abroad, yet a weird 3am purchase pattern gets blocked."},
{id:"ai4_4",m:"ai4",d:1,c:"robo-advisors",q:"A robo-advisor is...",o:["A physical robot in a bank branch","Software that builds and rebalances investment portfolios automatically at low fees","A trading chatroom","A financial news app"],a:1,x:"Questionnaire → risk profile → automated diversified portfolio. Wealth management for 0.25% instead of 1-2%."},
{id:"ai4_5",m:"ai4",d:3,c:"model-risk",q:"A systemic danger of widespread AI trading models is...",o:["They get bored","Models trained on similar data can herd — reacting identically and amplifying crashes","They unionize","They trade too slowly"],a:1,x:"Flash crashes preview this: correlated automated reactions cascade faster than humans can intervene."},
{id:"ai4_6",m:"ai4",d:3,c:"explainability",q:"Why does loan-decision AI need explainability?",o:["To make the code prettier","Regulators and customers can demand the reason for a denial — 'the black box said no' is legally indefensible","To run faster","Explainability is optional everywhere"],a:1,x:"Adverse-action rules require reasons. Interpretable models or explanation tools are a legal necessity in lending."},
{id:"ai4_7",m:"ai4",d:3,c:"bias",q:"A lending model trained on decades of historical decisions risks...",o:["Nothing, history is objective","Automating past discrimination present in that data at scale","Approving everyone","Becoming a chatbot"],a:1,x:"Bias in, bias out — but now systematic, fast, and with a veneer of objectivity. Fairness testing is mandatory engineering."},
{id:"ai4_8",m:"ai4",d:3,c:"backtesting",q:"A strategy shows amazing returns in backtests. The trap to check first:",o:["The returns are too small","Overfitting to the past — tweaked until it fits one historical sample that will not repeat","Backtests are always reliable","The data is too recent"],a:1,x:"Torture historical data long enough and it confesses to anything. Out-of-sample and live testing separate skill from curve-fitting."},
];

/* Business events */
const EVENTS = [

 s:"Your payment processing crashes during peak hours. Customers are furious on social media. Your CTO asks what to prioritize.",
 q:"What is the FIRST priority?",o:["Post a marketing campaign to distract users","Fail over to redundant systems and communicate transparently with users","Blame the cloud provider publicly","Turn everything off until Monday"],a:1,
 x:"Failover first, honest status updates second. Downtime handled with transparency can even build trust.",rw:{cash:300,val:2000},pn:{cash:-400,val:-2500}},

const QUIZ_LEN = 6, BOSS_LEN = 8, REVIEW_LEN = 10;
const QUIZ_HP = 3, BOSS_HP = 3;          // wrong answers allowed before KO
const BOSS_SECS = 20, BOSS_MODULE_REQ = 65;
const BOX_DAYS = [0, 1, 3, 7, 16, 30];
const FREE_BOXES = 2;                    // boxes earnable same-day; beyond needs real spaced review
const DAY = 86400000;

const SAVE_KEY = "fintech_tycoon_v2";

function freshState(){
  return {
    company:{name:"", cash:150, valBonus:0, upgrades:[]},
    xp:0, view:"hq",
    streak:{last:"", count:0},
    q:{}, mod:{}, boss:{},

    evDone:[], log:[], sound:true,
  };
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ state = JSON.parse(raw); return; } }catch(e){}
  state = freshState();
}

/* ----------------------- 8-BIT SOUND ----------------------- */
let actx = null;
function beep(seq){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for(const [f, d] of seq){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + d);
      t += d * .9;
    }
  }catch(e){}
}
const SFX = {
  hit:   () => beep([[660,.07],[880,.09]]),
  crit:  () => beep([[660,.06],[880,.06],[1320,.12]]),
  hurt:  () => beep([[220,.12],[160,.18]]),
  win:   () => beep([[523,.1],[659,.1],[784,.1],[1047,.22]]),
  lose:  () => beep([[330,.15],[262,.15],[196,.3]]),
  rank:  () => beep([[523,.08],[659,.08],[784,.08],[1047,.08],[1319,.2]]),
  buy:   () => beep([[988,.07],[1319,.12]]),
  click: () => beep([[880,.05]]),
  intro: () => beep([[392,.08],[523,.08],[659,.14]]),
};

/* ----------------------- ADAPTIVE ENGINE ----------------------- */
function qstat(id){ return state.q[id] || {at:0, ok:0, box:0, due:0}; }
function qMastery(id){ const s = qstat(id); return s.at === 0 ? 0 : Math.min(1, s.box/3); }
function moduleQs(mid){ return QUESTIONS.filter(q => q.m === mid); }
function moduleMastery(mid){
  const qs = moduleQs(mid);
  return qs.reduce((a,q) => a + qMastery(q.id), 0) / qs.length;
}
function modulePct(mid){ return Math.round(moduleMastery(mid)*100); }
function trackMastery(tr){
  const ms = MODULES.filter(m => m.track === tr);
  return ms.reduce((a,m) => a + moduleMastery(m.id), 0) / ms.length;
}
function conceptStats(){
  const map = {};
  for(const q of QUESTIONS){
    const s = qstat(q.id);
    if(s.at === 0) continue;
    (map[q.c] = map[q.c] || []).push(qMastery(q.id));
  }
  return Object.entries(map).map(([c,arr]) => ({c, m:arr.reduce((a,b)=>a+b,0)/arr.length, n:arr.length}))
    .sort((a,b) => a.m - b.m);
}
function dueReviews(){
  const now = Date.now();
  return QUESTIONS.filter(q => { const s = qstat(q.id); return s.at > 0 && s.due <= now && qMastery(q.id) < 1; });
}
function pickQuiz(mid){
  const now = Date.now();
  const qs = moduleQs(mid);
  const prof = moduleMastery(mid);
  const targetD = prof < .34 ? 1 : prof < .67 ? 2 : 3;
  const score = q => {
    const s = qstat(q.id);
    let v = 0;
    if(s.at > 0 && s.due <= now) v -= 100;
    if(s.at === 0) v -= 50 - Math.abs(q.d - targetD)*8;
    v += qMastery(q.id) * 30;
    v += Math.random()*6;
    return v;
  };
  return qs.slice().sort((a,b) => score(a) - score(b)).slice(0, QUIZ_LEN);
}
function pickBoss(tier){
  const pool = QUESTIONS.filter(q => MODULES.find(m => m.id === q.m).tier === tier);
  return pool.slice().sort(() => Math.random() - .5).slice(0, BOSS_LEN);
}
function pickReview(){
  return dueReviews().sort((a,b) => qstat(a.id).due - qstat(b.id).due).slice(0, REVIEW_LEN);
}
/* HARD MODE: boxes beyond FREE_BOXES only advance when the review was actually due.
   Full mastery therefore requires returning on later days — true spaced repetition. */
function recordAnswer(q, ok){
  const s = qstat(q.id);
  const wasDue = s.at === 0 || s.due <= Date.now();
  s.at++;
  if(ok){
    s.ok++;
    if(s.box < FREE_BOXES || wasDue) s.box = Math.min(BOX_DAYS.length - 1, s.box + 1);
  } else s.box = 0;
  s.due = Date.now() + BOX_DAYS[s.box]*DAY;
  state.q[q.id] = s;
  state.answered++; if(ok) state.correctTotal++;
}

/* ----------------------- ECONOMY / RPG ----------------------- */
function cashMult(){ return 1 + state.company.upgrades.reduce((a,id) => a + ((UPGRADES.find(u=>u.id===id).fx.cashMult)||0), 0); }
function xpMult(){ return 1 + state.company.upgrades.reduce((a,id) => a + ((UPGRADES.find(u=>u.id===id).fx.xpMult)||0), 0); }
function valuation(){
  const upgVal = state.company.upgrades.reduce((a,id) => a + ((UPGRADES.find(u=>u.id===id).fx.val)||0), 0);
  const masteredBonus = MODULES.filter(m => moduleMastery(m.id) >= .8).length * 3000;
  return Math.max(0, 5000 + Math.round(state.xp*15) + upgVal + masteredBonus + state.company.valBonus + Math.round(state.company.cash*1.5));
}
function rank(){ let r = RANKS[0]; for(const k of RANKS) if(state.xp >= k.xp) r = k; return r; }
function nextRank(){ return RANKS.find(k => k.xp > state.xp) || null; }
function tierUnlocked(t){ return t === 1 || !!state.boss[t-1]; }
function bossReady(t){ return MODULES.filter(m => m.tier === t).every(m => modulePct(m.id) >= BOSS_MODULE_REQ); }
function gainXP(n){
  const before = rank().name;
  state.xp += Math.round(n * xpMult());
  if(rank().name !== before){ SFX.rank(); toast("🎉 RANK UP! " + rank().ico + " " + rank().name); }
}
function gainCash(n){ state.company.cash += Math.round(n * cashMult()); }
function touchStreak(){
  const today = new Date().toDateString();
  if(state.streak.last === today) return;
  const yest = new Date(Date.now() - DAY).toDateString();
  state.streak.count = (state.streak.last === yest) ? state.streak.count + 1 : 1;
  state.streak.last = today;
}
function logEv(s){ state.log.unshift(s); state.log = state.log.slice(0,6); }
function fmt(n){ return n >= 1e6 ? "$" + (n/1e6).toFixed(2) + "M" : "$" + n.toLocaleString("en-US"); }

/* ----------------------- BATTLE SESSION ----------------------- */
let S = null;
let timerH = null;

function shuffleOpts(q){ return q.o.map((t,i) => ({t, orig:i})).sort(() => Math.random() - .5); }

function battleFoe(){
  if(S.mode === "boss"){ const t = TIERS[S.tier-1]; return {name:t.boss, ico:t.bico}; }
  if(S.mode === "review") return {name:"MEMORY PHANTOM", ico:"🌫️"};
  const m = MODULES.find(x => x.id === S.mid);
  return {name:m.mon, ico:m.mico};
}
function startQuiz(mid){
  SFX.intro();
  S = {mode:"quiz", mid, qs:pickQuiz(mid), i:0, ok:0, combo:0, php:QUIZ_HP, lastHit:"",
       xpEarned:0, cashEarned:0, picked:-1, phase:"intro"};
  S.opts = shuffleOpts(S.qs[0]); state.view = "session"; render();
}
function startReview(){
  const qs = pickReview(); if(!qs.length) return;
  SFX.intro();
  S = {mode:"review", qs, i:0, ok:0, combo:0, php:QUIZ_HP, lastHit:"",
       xpEarned:0, cashEarned:0, picked:-1, phase:"intro", opts:shuffleOpts(qs[0])};
  state.view = "session"; render();
}
function startBoss(tier){
  SFX.intro();
  S = {mode:"boss", tier, qs:pickBoss(tier), i:0, ok:0, combo:0, php:BOSS_HP, lastHit:"",
       xpEarned:0, cashEarned:0, picked:-1, phase:"intro", secs:BOSS_SECS};
  S.opts = shuffleOpts(S.qs[0]); state.view = "session"; render();
}
function startEvent(){
  const pool = EVENTS.filter(e => tierUnlocked(e.minTier) && !(state.evDone||[]).includes(e.id));
  const all = pool.length ? pool : EVENTS.filter(e => tierUnlocked(e.minTier));
  const ev = all[Math.floor(Math.random()*all.length)];
  S = {mode:"event", ev, i:0, ok:0, picked:-1, phase:"q", opts:shuffleOpts(ev)};
  state.view = "session"; render();
}
function beginFight(){
  SFX.click();
  S.phase = "q";
  render();
  if(S.mode === "boss") armTimer();
}
function armTimer(){
  clearInterval(timerH);
  timerH = setInterval(() => {
    if(!S || S.mode !== "boss" || S.phase !== "q"){ clearInterval(timerH); return; }
    S.secs--;
    const el = document.getElementById("bosstimer");
    if(el){ el.textContent = S.secs; if(S.secs<=5) el.classList.add("blink"); }
    if(S.secs <= 0){ clearInterval(timerH); answer(-1); }
  }, 1000);
}
function answer(idx){
  if(!S || S.phase !== "q" || S.picked !== -1) return;
  clearInterval(timerH);
  S.picked = idx;
  const q = S.mode === "event" ? S.ev : S.qs[S.i];
  const ok = idx >= 0 && S.opts[idx].orig === q.a;

  if(S.mode === "event"){
    const fx = ok ? q.rw : q.pn;
    state.company.cash = Math.max(0, state.company.cash + fx.cash);
    state.company.valBonus += fx.val;
    if(ok){ gainXP(25); S.ok = 1; SFX.win(); } else SFX.lose();
    state.evDone = (state.evDone||[]).concat(q.id);
    logEv((ok ? "✅ " : "❌ ") + q.title);
    touchStreak(); save(); render(); return;
  }

  recordAnswer(q, ok);
  if(ok){
    S.ok++; S.combo++;
    const comboM = S.combo >= 5 ? 1.5 : S.combo >= 3 ? 1.25 : 1;
    const xp = Math.round(6 * q.d * comboM * (S.mode === "boss" ? 1.5 : 1));
    const cash = Math.round(15 * q.d * comboM);
    gainXP(xp); gainCash(cash);
    S.xpEarned += xp; S.cashEarned += cash;
    S.lastHit = "enemy";
    if(S.combo >= 3) SFX.crit(); else SFX.hit();
  } else {
    S.combo = 0; S.php--; S.lastHit = "player";
    SFX.hurt();
  }
  S.phase = "fb";
  touchStreak(); save(); render();
}
function nextQ(){
  if(!S) return;
  SFX.click();
  if(S.php <= 0){ finishSession(true); return; }
  if(S.i >= S.qs.length - 1){ finishSession(false); return; }
  S.i++; S.picked = -1; S.opts = shuffleOpts(S.qs[S.i]); S.phase = "q"; S.lastHit = "";
  if(S.mode === "boss"){ S.secs = BOSS_SECS; render(); armTimer(); } else render();
}
function finishSession(ko){
  clearInterval(timerH);
  S.done = true; S.ko = !!ko;
  S.pct = Math.round(100*S.ok/S.qs.length);
  if(S.mode === "quiz"){
    const m = state.mod[S.mid] || {best:0, attempts:0};
    m.attempts++;
    if(!ko) m.best = Math.max(m.best, S.pct);
    state.mod[S.mid] = m;
    const mod = MODULES.find(x=>x.id===S.mid);
    logEv((ko ? "💀 KO vs " : "⚔️ ") + mod.mon + " — " + S.pct + "%");
    S.eventNext = !ko && Math.random() < .3;
  } else if(S.mode === "boss"){
    if(!ko){
      S.bossWon = true;
      if(!state.boss[S.tier]){
        state.boss[S.tier] = true;
        const reward = 1000 * S.tier;
        state.company.cash += reward; gainXP(60*S.tier);
        S.bossReward = reward;
        logEv("🏅 BADGE EARNED: " + TIERS[S.tier-1].boss);
      } else S.bossReward = 0;
    } else logEv("💀 Crushed by " + TIERS[S.tier-1].boss);
  } else if(S.mode === "review"){
    logEv((ko?"💀":"🔁") + " Training — " + S.pct + "%");
  }
  if(ko) SFX.lose(); else SFX.win();
  save(); render();
}
function endSession(toEvent){
  const wasQuizEvent = S && S.eventNext && toEvent;
  S = null; clearInterval(timerH);
  if(wasQuizEvent){ startEvent(); return; }
  state.view = "hq"; save(); render();
}
function buyUpgrade(id){
  const u = UPGRADES.find(x => x.id === id);
  if(!u || state.company.upgrades.includes(id)) return;
  if(state.company.cash < u.cost || modulePct(u.req.m) < u.req.p) return;
  state.company.cash -= u.cost;
  state.company.upgrades.push(id);
  gainXP(30);
  logEv("🏗️ Built: " + u.name);
  SFX.buy();
  toast(u.ico + " " + u.name.toUpperCase() + " GET!");
  save(); render();
}
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2100);
}
function toggleSound(){ state.sound = !state.sound; save(); render(); }
function go(v){ SFX.click(); state.view = v; save(); render(); window.scrollTo(0,0); }
function setName(){
  const el = document.getElementById("cname");
  const n = (el.value || "").trim();
  if(!n) return;
  state.company.name = n; state.view = "hq";
  logEv("🚀 " + n + " is founded!");
  SFX.win();
  save(); render();
}
function resetGame(){
  if(!confirm("Reset ALL progress? Your empire will crumble to dust.")) return;
  state = freshState(); save(); render();
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* typewriter for battle dialog */
let twTimer = null;
function typewrite(id, text){
  const el = document.getElementById(id);
  if(!el) return;
  clearInterval(twTimer);
  let i = 0; el.textContent = "";
  twTimer = setInterval(() => {
    i += 2;
    el.textContent = text.slice(0, i);
    if(i >= text.length) clearInterval(twTimer);
  }, 16);
  el.onclick = () => { clearInterval(twTimer); el.textContent = text; };
}

    <div style="max-width:430px;margin:0 auto">
      <input type="text" id="cname" maxlength="20" placeholder="STARTUP NAME" onkeydown="if(event.key==='Enter')setName()">
      <button class="primary big" style="margin-top:12px" onclick="setName()">▶ START ADVENTURE</button>
      <p class="tiny blink" style="margin-top:14px">PRESS START — © FINTECH KINGDOM</p>
    </div>
  </div>`;
}

function vNav(){
  const tabs = [["hq","🏰","BASE"],["learn","🗺️","WORLD"],["review","🥋","DOJO"],["company","🏪","MART"]];
  const due = dueReviews().length;
  return `<nav>` + tabs.map(([v,i,l]) =>
    `<button class="${state.view===v?'on':''}" onclick="go('${v}')"><span class="nico">${i}</span>${l}${v==='review'&&due?` (${due})`:''}</button>`
  ).join("") + `</nav>`;
}

function vHQ(){
  const r = rank(), nx = nextRank();
  const rankPct = nx ? Math.round(100*(state.xp - r.xp)/(nx.xp - r.xp)) : 100;
  const due = dueReviews().length;
  const weak = conceptStats().slice(0,3);
  const acc = state.answered ? Math.round(100*state.correctTotal/state.answered) : 0;
  const nextBossTier = TIERS.find(t => tierUnlocked(t.n) && !state.boss[t.n]);
  return `
  <div class="pb dark">
    <div class="row sb">
      <div><p class="tiny">FOUNDER CARD</p><h2>${esc(state.company.name)}</h2></div>
      <div class="sprite" style="font-size:34px">${r.ico}</div>
    </div>
    <p style="margin-top:6px">RANK: <span style="color:#f8d870">${r.name}</span></p>
    <div class="row sb" style="margin-top:8px">
      <span class="tiny">${nx ? (nx.xp - state.xp) + " XP TO " + nx.name : "MAXIMUM RANK!"}</span>
      <span class="tiny">${state.xp} XP</span>
    </div>
    <div class="bar" style="margin-top:4px;background:#404060"><i style="width:${rankPct}%;background:#f8d870"></i></div>
    <p style="margin-top:10px" class="tiny">BADGES:
      ${TIERS.map(t => `<span class="badge ${state.boss[t.n]?'':'empty'}" title="${t.boss}">${state.boss[t.n]?t.badge:"?"}</span>`).join("")}
    </p>
  </div>
  <div class="grid3">
    <div class="pb center"><p class="tiny">CASH</p><h2 style="color:var(--gold)">${fmt(state.company.cash)}</h2></div>
    <div class="pb center"><p class="tiny">VALUATION</p><h2 style="color:var(--blue)">${fmt(valuation())}</h2></div>
    <div class="pb center"><p class="tiny">ACCURACY</p><h2>${acc}%${state.streak.count>1?` 🔥${state.streak.count}`:""}</h2></div>
  </div>
  ${due ? `<div class="pb cream"><div class="row sb">
    <div style="flex:1"><h3>🌫️ ${due} MEMORIES ARE FADING!</h3><p class="tiny">The MEMORY PHANTOM feeds on forgotten knowledge.</p></div>
    <button class="primary" onclick="startReview()">FIGHT</button></div></div>` : ""}
  ${nextBossTier && bossReady(nextBossTier.n) ? `<div class="pb cream"><div class="row sb">
    <div style="flex:1"><h3>${TIERS[nextBossTier.n-1].bico} ${nextBossTier.boss} BLOCKS YOUR PATH!</h3><p class="tiny">Defeat the boss to earn the ${TIERS[nextBossTier.n-1].badge} badge and open Tier ${nextBossTier.n+1}.</p></div>
    <button class="danger" onclick="startBoss(${nextBossTier.n})">BATTLE</button></div></div>` : ""}
  <div class="pb">
    <h3 class="caps">▦ Mastery</h3>
    ${Object.entries(TRACKS).map(([k,t]) => {
      const pct = Math.round(trackMastery(k)*100);
      return `<div class="row sb" style="margin-top:8px"><span class="tiny">${t.ico} ${t.name.toUpperCase()}</span><span class="tiny">${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%;background:${hpBarColor(pct/100)}"></i></div>`;
    }).join("")}
    ${weak.length ? `<p class="tiny" style="margin-top:10px">WEAK SPOTS: ${weak.map(w => w.c.toUpperCase()+" "+Math.round(w.m*100)+"%").join(" • ")}</p>` : ""}
  </div>
  <div class="pb"><h3 class="caps">▦ Journal</h3>
    ${state.log.length ? state.log.map(l => `<p class="tiny" style="margin-top:6px">• ${esc(l)}</p>`).join("") : '<p class="tiny" style="margin-top:6px">• Your story begins. Head to the WORLD map!</p>'}
  </div>
  <div class="pb"><h3 class="caps">▦ Road to the throne</h3>
    <div style="margin-top:6px">${RANKS.map(k => `<div class="rankrow ${k.name===r.name?'now':state.xp>=k.xp?'done':''}">
      <span>${k.ico}</span><span class="tiny" style="flex:1">${k.name}</span><span class="tiny">${k.xp}</span></div>`).join("")}</div>
  </div>
  <div class="row sb">
    <button class="tiny" onclick="toggleSound()">${state.sound?"🔊 SOUND ON":"🔇 SOUND OFF"}</button>
    <button class="tiny" onclick="resetGame()">⚠ RESET</button>
  </div>`;
}

function vLearn(){
  let html = `<h2 class="caps">🗺️ World Map</h2>
  <p class="tiny" style="margin:6px 0">Tame every wild Finmon of a tier (≥${BOSS_MODULE_REQ}% mastery) to challenge its boss. Full mastery needs spaced training over days!</p>`;
  for(const t of TIERS){
    const unlocked = tierUnlocked(t.n);
    html += `<div class="pb dark" style="padding:9px 12px"><div class="row sb">
      <span class="tiny">ROUTE ${t.n} — ${t.name.toUpperCase()}</span>
      ${state.boss[t.n] ? `<span class="tag gold">${t.badge} CLEARED</span>`
        : unlocked && bossReady(t.n) ? `<button class="danger tiny" onclick="startBoss(${t.n})">${t.bico} FIGHT ${t.boss}</button>`
        : unlocked ? `<span class="tag">BOSS: ${t.boss}</span>` : `<span class="tag">🔒 LOCKED</span>`}
    </div></div>`;
    html += `<div class="grid3">`;
    for(const m of MODULES.filter(x => x.tier === t.n)){
      const pct = modulePct(m.id);
      const tr = TRACKS[m.track];
      html += unlocked
        ? `<div class="pb mcard" onclick="go('lesson_${m.id}')" style="margin:0">
            <div class="row sb"><span class="sprite mini">${m.mico}</span><span class="tag ${tr.cls}">${tr.ico}</span></div>
            <p style="margin-top:6px"><b>${m.mon}</b> <span class="tiny">Lv.${Math.floor(pct/10)}</span></p>
            <p class="tiny" style="margin:3px 0">${m.name}</p>
            <div class="bar"><i style="width:${pct}%;background:${hpBarColor(pct/100)}"></i></div>
            <p class="tiny" style="margin-top:3px">${pct}%${pct>=100?" ⭐ TAMED":""}</p>
          </div>`
        : `<div class="pb" style="margin:0;opacity:.7">
            <span class="sprite mini shadow">${m.mico}</span>
            <p style="margin-top:6px"><b>???</b></p>
            <p class="tiny">A mysterious creature. Clear Route ${t.n-1} first.</p>
          </div>`;
    }
    html += `</div><div style="height:12px"></div>`;
  }
  return html;
}

function vLesson(mid){
  const m = MODULES.find(x => x.id === mid);
  const tr = TRACKS[m.track];
  const pct = modulePct(mid);
  const st = state.mod[mid];
  return `<button class="tiny" onclick="go('learn')">◀ MAP</button>
  <div class="pb dark" style="margin-top:10px"><div class="row sb">
    <div><p class="tiny">FINDEX No.${MODULES.indexOf(m)+1} — ${tr.name.toUpperCase()} TYPE</p>
      <h2>${m.mon}</h2><p class="tiny">${m.name}</p></div>
    <span class="sprite">${m.mico}</span></div>
    <div class="bar" style="margin-top:8px;background:#404060"><i style="width:${pct}%;background:${hpBarColor(pct/100)}"></i></div>
    <p class="tiny" style="margin-top:4px">MASTERY ${pct}%${st ? " • BEST " + st.best + "% • " + st.attempts + " BATTLES" : " • NEVER FOUGHT"}</p>
  </div>
  <div class="pb"><h3 class="caps">📖 Field notes</h3>
    <ul style="list-style:none;margin-top:10px">${m.lesson.map(l => `<li class="lessonli tiny" style="font-size:9px">${l}</li>`).join("")}</ul>
  </div>
  <button class="primary big" onclick="startQuiz('${mid}')">⚔ BATTLE ${m.mon}!</button>`;
}

function vBattle(){
  if(S.mode === "event") return vEvent();
  if(S.done) return vResults();
  const q = S.qs[S.i];
  const foe = battleFoe();
  const total = S.qs.length;
  const ehp = total - S.ok;
  const maxhp = S.mode === "boss" ? BOSS_HP : QUIZ_HP;
  const inFb = S.phase === "fb";
  const ok = inFb && S.picked >= 0 && S.opts[S.picked].orig === q.a;

  let dialog;
  if(S.phase === "intro"){
    dialog = `<div class="dlg"><p id="twmsg"></p><span class="arrow">▼</span></div>
      <button class="primary big" style="margin-top:8px" onclick="beginFight()">⚔ FIGHT</button>`;
  } else if(S.phase === "q"){
    dialog = `<p class="tiny" style="margin-bottom:6px">${"★".repeat(q.d)}${"☆".repeat(3-q.d)} ${q.d===1?"BASIC":q.d===2?"PRO":"EXPERT"} ATTACK ${S.combo>=3?` — 🔥COMBO x${S.combo>=5?"1.5":"1.25"}`:""}</p>
      <p style="margin-bottom:10px">${q.q}</p>
      <div class="moves">${S.opts.map((o,i) => `<button class="move" onclick="answer(${i})">▶ ${o.t}</button>`).join("")}</div>`;
  } else {
    dialog = `<div class="moves">${S.opts.map((o,i) => {
        let cls = "move";
        if(o.orig === q.a) cls += " good"; else if(i === S.picked) cls += " bad"; else cls += " fade";
        return `<button class="${cls}" disabled>▶ ${o.t}</button>`;
      }).join("")}
      <div></div></div>
      <p id="twmsg" style="margin-top:10px"></p>
      <p class="tiny" style="margin-top:8px">${q.x}</p>
      <button class="primary big" style="margin-top:10px" onclick="nextQ()">${S.php<=0 ? "..." : S.i >= total-1 ? "FINISH ▶" : "NEXT ▶"}</button>`;
  }

  return `
  <div class="row sb">
    <span class="tiny caps">${S.mode==="boss"?"💀 BOSS BATTLE":S.mode==="review"?"🥋 TRAINING BATTLE":"⚔ WILD BATTLE"}</span>
    <span class="tiny">TURN ${S.i+1}/${total}</span>
  </div>
  <div class="bfield">
    <div class="erow">
      <div class="infobox">
        <p class="tiny"><b>${foe.name}</b>${S.mode==="boss"?" 💀":""}</p>
        <div class="row sb"><span class="tiny">HP</span>
          ${S.mode==="boss" && S.phase==="q" ? `<span class="timerbox" id="bosstimer">${S.secs}</span>` : ""}</div>
        <div class="bar"><i style="width:${Math.round(100*ehp/total)}%;background:${hpBarColor(ehp/total)}"></i></div>
      </div>
      <span class="sprite big ${S.phase==='intro'?'appear':''} ${inFb && S.lastHit==='enemy' ? (ehp===0?'faint':'hit'):''}">${foe.ico}</span>
    </div>
    <div class="prow">
      <span class="sprite ${inFb && S.lastHit==='player' ? (S.php<=0?'faint':'hit'):''}">🧑‍💼</span>
      <div class="infobox">
        <p class="tiny"><b>${esc(state.company.name).slice(0,14)}</b></p>
        <p class="hearts">${hearts(S.php, maxhp)}</p>
      </div>
    </div>
  </div>
  <div class="pb">${dialog}</div>`;
}

function vEvent(){
  const ev = S.ev;
  const answered = S.picked !== -1;
  const ok = answered && S.picked >= 0 && S.opts[S.picked].orig === ev.a;
  return `<div class="pb dark"><p class="tiny blink">⚡ BREAKING NEWS</p>
    <h2 style="margin:8px 0">${ev.ico} ${ev.title}</h2>
    <p class="tiny" style="line-height:2">${ev.s}</p></div>
  <div class="pb"><p style="margin-bottom:10px">${ev.q}</p>
    <div class="moves">${S.opts.map((o,i) => {
      let cls = "move";
      if(answered){ if(o.orig === ev.a) cls += " good"; else if(i === S.picked) cls += " bad"; else cls += " fade"; }
      return `<button class="${cls}" ${answered?"disabled":""} onclick="answer(${i})">▶ ${o.t}</button>`;
    }).join("")}</div>
    ${answered ? `<p style="margin-top:10px">${ok?"✅ MASTERSTROKE!":"❌ COSTLY MISTAKE..."}</p>
      <p class="tiny" style="margin-top:6px">${ev.x}</p>
      <p class="tiny" style="margin-top:8px;color:${ok?'var(--green)':'var(--red)'}">${ok ? `+${fmt(ev.rw.cash)} CASH / +${fmt(ev.rw.val)} VALUATION / +25 XP` : `${fmt(ev.pn.cash)} CASH / ${fmt(ev.pn.val)} VALUATION`}</p>
      <button class="primary big" style="margin-top:10px" onclick="endSession(false)">BACK TO BASE ▶</button>` : ""}
  </div>`;
}

function vResults(){
  const foe = battleFoe();
  let title, sub = "";
  if(S.ko){
    title = "💀 YOU BLACKED OUT!";
    sub = S.mode === "boss" ? foe.name + " was too strong. Train the tier modules and return!"
        : "You kept the XP you earned, but " + foe.name + " escaped untamed.";
  } else if(S.mode === "boss"){
    title = "🏅 " + foe.name + " DEFEATED!";
    sub = S.bossReward ? "BADGE GET! " + fmt(S.bossReward) + " bounty + " + (60*S.tier) + " XP. Route " + (S.tier+1 <= 4 ? S.tier+1 : "MAX") + " is open!" : "Glory never gets old.";
  } else {
    title = S.pct >= 90 ? "🌟 FLAWLESS VICTORY!" : S.pct >= 70 ? "⚔ VICTORY!" : "😮‍💨 NARROW ESCAPE...";
    sub = S.pct >= 70 ? "" : "The engine will hunt your mistakes in the DOJO.";
  }
  return `<div class="pb center">
    <span class="sprite big ${S.ko?'':'appear'}">${S.ko ? "🧑‍💼" : foe.ico}</span>
    <h2 style="margin:10px 0">${title}</h2>
    ${sub ? `<p class="tiny">${sub}</p>` : ""}
    <div class="grid3" style="margin:12px 0">
      <div class="pb cream center" style="margin:0"><p class="tiny">HITS</p><h3>${S.ok}/${S.qs.length}</h3></div>
      <div class="pb cream center" style="margin:0"><p class="tiny">XP</p><h3 style="color:var(--violet)">+${S.xpEarned}</h3></div>
      <div class="pb cream center" style="margin:0"><p class="tiny">CASH</p><h3 style="color:var(--gold)">+${fmt(S.cashEarned)}</h3></div>
    </div>
    ${S.eventNext ? `<p class="tiny blink" style="margin-bottom:8px">⚡ SOMETHING IS HAPPENING AT YOUR COMPANY...</p>
      <button class="danger big" onclick="endSession(true)">HANDLE IT ▶</button>`
    : `<button class="primary big" onclick="endSession(false)">CONTINUE ▶</button>`}
  </div>`;
}

function vReview(){
  const due = dueReviews();
  const cs = conceptStats();
  return `<h2 class="caps">🥋 The Dojo</h2>
  <p class="tiny" style="margin:6px 0">The MEMORY PHANTOM grows stronger as you forget. Spaced repetition: each concept returns right before it fades (1, 3, 7, 16, 30 days). Beyond level 2, mastery only grows on a DUE day — patience, grasshopper.</p>
  <div class="pb cream">
    ${due.length ? `<div class="row sb">
      <div style="flex:1"><h3>🌫️ ${due.length} FADING ${due.length>1?"MEMORIES":"MEMORY"}!</h3><p class="tiny">Defeat the phantom to lock them in.</p></div>
      <button class="primary" onclick="startReview()">FIGHT</button></div>`
    : `<h3>✅ MIND FORTRESS SECURE</h3><p class="tiny">Nothing due. The forgetting curve never sleeps — return tomorrow.</p>`}
  </div>
  ${cs.length ? `<div class="pb"><h3 class="caps">▦ Concept mastery</h3>
    ${cs.map(w => `<div class="row sb" style="margin-top:8px"><span class="tiny">${w.c.toUpperCase()}</span><span class="tiny">${Math.round(w.m*100)}%</span></div>
      <div class="bar"><i style="width:${Math.round(w.m*100)}%;background:${hpBarColor(w.m)}"></i></div>`).join("")}
  </div>` : `<div class="pb"><p class="tiny">Fight some battles first — your concept map will appear here.</p></div>`}`;
}

function vCompany(){
  return `<h2 class="caps">🏪 Tycoon Mart</h2>
  <div class="pb"><p>CLERK: Welcome to ${esc(state.company.name).toUpperCase()} MART! Upgrades need <b>CASH</b> and <b>KNOWLEDGE</b>. No shortcuts to the throne!</p></div>
  <div class="grid3">
    <div class="pb center" style="margin:0"><p class="tiny">CASH</p><h3 style="color:var(--gold)">${fmt(state.company.cash)}</h3></div>
    <div class="pb center" style="margin:0"><p class="tiny">CASH MULT</p><h3>x${cashMult().toFixed(2)}</h3></div>
    <div class="pb center" style="margin:0"><p class="tiny">XP MULT</p><h3>x${xpMult().toFixed(2)}</h3></div>
  </div>
  <div style="height:10px"></div>
  ${UPGRADES.map(u => {
    const owned = state.company.upgrades.includes(u.id);
    const reqM = MODULES.find(m => m.id === u.req.m);
    const reqOK = modulePct(u.req.m) >= u.req.p;
    const canBuy = !owned && reqOK && state.company.cash >= u.cost;
    const fx = [];
    if(u.fx.cashMult) fx.push("+" + Math.round(u.fx.cashMult*100) + "% CASH");
    if(u.fx.xpMult) fx.push("+" + Math.round(u.fx.xpMult*100) + "% XP");
    if(u.fx.val) fx.push("+" + fmt(u.fx.val) + " VAL");
    return `<div class="pb" style="margin:8px 0;${owned?'background:#d8e8c8':''}">
      <div class="row sb">
        <span class="sprite mini">${u.ico}</span>
        <div style="flex:1;min-width:150px">
          <p><b>${u.name.toUpperCase()}</b> ${owned?'<span class="tag green">OWNED</span>':`<span class="tag gold">${fmt(u.cost)}</span>`}</p>
          <p class="tiny" style="margin:3px 0">${u.desc}</p>
          <p class="tiny"><span class="tag ${reqOK?'green':'red'}">${reqM.mon} ≥${u.req.p}% (${modulePct(u.req.m)}%)</span> ${fx.join(" • ")}</p>
        </div>
        ${!owned ? `<button class="tiny" ${canBuy?"":"disabled"} onclick="buyUpgrade('${u.id}')">${reqOK ? (state.company.cash >= u.cost ? "BUY" : "NO CASH") : "LOCKED"}</button>` : ""}
      </div></div>`;
  }).join("")}`;
}

function render(){
  const app = document.getElementById("app");
  if(!state.company.name){ app.innerHTML = vOnboard(); return; }
  let body;
  if(state.view === "session" && S) body = vBattle();
  else if(state.view && state.view.startsWith("lesson_")) body = vLesson(state.view.slice(7));
  else if(state.view === "learn") body = vLearn();
  else if(state.view === "review") body = vReview();
  else if(state.view === "company") body = vCompany();
  else { state.view = "hq"; body = vHQ(); }
  app.innerHTML = body + (state.view === "session" ? "" : vNav());
  /* battle dialog typewriter */
  if(state.view === "session" && S && !S.done && S.mode !== "event"){
    const foe = battleFoe();
    if(S.phase === "intro"){
      const msg = S.mode === "boss" ? "Boss " + foe.name + " wants to crush your startup!"
        : S.mode === "review" ? "The MEMORY PHANTOM emerges from the fog of forgetting!"
        : "A wild " + foe.name + " appeared!";
      typewrite("twmsg", msg);
    } else if(S.phase === "fb"){
      const q = S.qs[S.i];
      const ok = S.picked >= 0 && S.opts[S.picked].orig === q.a;
      const msg = S.picked < 0 ? "⏰ Too slow! " + foe.name + " strikes!"
        : ok ? (S.combo >= 3 ? "💥 CRITICAL HIT! " + foe.name + " staggers!" : "✅ A solid hit! +" + Math.round(6*q.d*(S.mode==="boss"?1.5:1)) + " XP")
        : "❌ It backfired! " + foe.name + " hits you hard!";
      typewrite("twmsg", msg);
    }
  }
}

load();
if(state.view === "session") state.view = "hq";
render();
</script>
</body>
</html>
